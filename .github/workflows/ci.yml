name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare CI Config
        run: |
          cp config.example.py config.py
          python - <<'PY'
          from pathlib import Path
          config_path = Path("config.py")
          content = config_path.read_text(encoding="utf-8")
          content += '\nCHROMA_PERSIST_DIR = "data/chroma_db_ci"\n'
          config_path.write_text(content, encoding="utf-8")
          PY

      - name: Run Mock Pipeline Smoke Test
        run: |
          python main.py --mock --limit 2 --output data/ci_results.jsonl

      - name: Generate Graph Visualization
        run: |
          python visualize.py --input data/ci_results.jsonl --output data/ci_graph.html

      - name: Validate Outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results_path = Path("data/ci_results.jsonl")
          graph_path = Path("data/ci_graph.html")

          assert results_path.exists(), "Missing data/ci_results.jsonl"
          assert graph_path.exists(), "Missing data/ci_graph.html"

          lines = [line for line in results_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert lines, "Pipeline output is empty"

          first = json.loads(lines[0])
          assert "article_id" in first, "Missing article_id in first result"
          assert "linked_entities" in first, "Missing linked_entities in first result"

          html = graph_path.read_text(encoding="utf-8")
          assert "vis-network" in html, "Visualization HTML was not generated correctly"
          PY

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            data/ci_results.jsonl
            data/ci_graph.html
